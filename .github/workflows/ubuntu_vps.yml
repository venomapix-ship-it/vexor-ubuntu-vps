name: VEXOR Ubuntu VPS

on:
  workflow_dispatch:
    inputs:
      auto_restart:
        required: false
        default: 'true'

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ubuntu User, SSH & Bot Dependencies
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server unzip zip tmux screen python3-pip python3-venv curl wget jq netcat-openbsd openssl >/dev/null

          echo "PIP_BREAK_SYSTEM_PACKAGES=1" | sudo tee -a /etc/environment >/dev/null
          sudo pip3 install --break-system-packages -q requests urllib3 PySocks cryptography asn1crypto

          if ! id "$SSH_USER" >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$SSH_USER"
          fi
          echo "$SSH_USER:$SSH_PASS" | sudo chpasswd
          echo "root:$SSH_PASS" | sudo chpasswd
          echo "$SSH_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee "/etc/sudoers.d/$SSH_USER" >/dev/null

          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*KbdInteractiveAuthentication.*/KbdInteractiveAuthentication yes/' /etc/ssh/sshd_config
          sudo mkdir -p /run/sshd
          sudo systemctl restart ssh || sudo service ssh restart

      - name: Restore Encrypted Backup & Auto-Start VEXOR Bot
        env:
          RUNNER_TRACKING_ID: ""
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO:  ${{ github.repository }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          USER_HOME="/home/$SSH_USER"
          BOT_DIR="$USER_HOME/bot"
          sudo mkdir -p "$BOT_DIR"

          if gh release download "delta-backup" -p "ubuntu_delta.tar.gz.enc" -O "/tmp/ubuntu_delta.tar.gz.enc" --repo "$GH_REPO" 2>/dev/null; then
            echo "[+] Restoring encrypted backup..."
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SSH_PASS -in "/tmp/ubuntu_delta.tar.gz.enc" -out "/tmp/ubuntu_delta.tar.gz"
            sudo tar -xzf "/tmp/ubuntu_delta.tar.gz" -C "$USER_HOME"
            sudo rm -f "/tmp/ubuntu_delta.tar.gz" "/tmp/ubuntu_delta.tar.gz.enc"
          elif gh release download "delta-backup" -p "ubuntu_delta.tar.gz" -O "/tmp/ubuntu_delta.tar.gz" --repo "$GH_REPO" 2>/dev/null; then
            echo "[+] Restoring previous backup..."
            sudo tar -xzf "/tmp/ubuntu_delta.tar.gz" -C "$USER_HOME"
            sudo rm -f "/tmp/ubuntu_delta.tar.gz"
          elif [ -f "$GITHUB_WORKSPACE/bot1.zip" ]; then
            echo "[+] First run: Extracting bot1.zip..."
            sudo unzip -q -o "$GITHUB_WORKSPACE/bot1.zip" -d "$BOT_DIR"
          fi

          cat << 'BOTEOF' | sudo tee "$USER_HOME/run_bot.sh" >/dev/null
          #!/bin/bash
          export PIP_BREAK_SYSTEM_PACKAGES=1
          BOT_FILE=$(find "$HOME/bot" -maxdepth 3 -name "bot.py" | head -1)
          if [ -z "$BOT_FILE" ]; then
            echo "[!] bot.py not found in ~/bot"
            sleep 3600
            exit 0
          fi
          cd "$(dirname "$BOT_FILE")"
          while true; do
            echo "🤖 [$(date '+%H:%M:%S')] Starting VEXOR Bot..."
            if [ -f .env ]; then
              set -a
              source .env
              set +a
            fi
            python3 -u bot.py
            echo "⚠️ Bot stopped! Restarting in 5 seconds..."
            sleep 5
          done
          BOTEOF

          sudo chmod +x "$USER_HOME/run_bot.sh"
          sudo chown -R "$SSH_USER:$SSH_USER" "$USER_HOME"

          sudo -u "$SSH_USER" tmux new-session -d -s bot "bash $USER_HOME/run_bot.sh"
          echo "[+] VEXOR Bot started automatically in tmux session 'bot'"

      - name: Static IP & Unified Port Tunnel + Watchdog (45m Encrypted Backup)
        env:
          RUNNER_TRACKING_ID: ""
          GH_TOKEN:     ${{ secrets.GH_PAT }}
          GH_REPO:      ${{ github.repository }}
          TG_TOKEN:     ${{ secrets.TG_TOKEN }}
          TG_CHATS:     ${{ secrets.TG_CHATS }}
          SSH_USER:     ${{ secrets.SSH_USER }}
          SSH_PASS:     ${{ secrets.SSH_PASS }}
          RELAY_IP:     "159.223.110.159"
          FIXED_PORT:   "54822"
        run: |
          set +e
          curl -Ls "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz" -o /tmp/bore.tar.gz
          sudo tar -xzf /tmp/bore.tar.gz -C /usr/local/bin bore
          sudo chmod +x /usr/local/bin/bore

          start_tunnel() {
            BORE_PORT=""
            for attempt in 1 2 3; do
              sudo rm -f /tmp/bore.log
              nohup bore local 22 --to "$RELAY_IP" --port "$FIXED_PORT" > /tmp/bore.log 2>&1 &
              CUR_PID=$!
              for i in $(seq 1 8); do
                sleep 2
                if grep -q "listening at" /tmp/bore.log 2>/dev/null; then
                  BORE_PORT="$FIXED_PORT"
                  break 2
                fi
              done
              kill -9 "$CUR_PID" 2>/dev/null || true
              sleep 5
            done

            if [ -z "$BORE_PORT" ]; then
              sudo rm -f /tmp/bore.log
              nohup bore local 22 --to "$RELAY_IP" > /tmp/bore.log 2>&1 &
              CUR_PID=$!
              for i in $(seq 1 15); do
                sleep 2
                if grep -q "listening at" /tmp/bore.log 2>/dev/null; then
                  BORE_PORT=$(grep -oE ":[0-9]+" /tmp/bore.log | head -1 | tr -d ':')
                  break
                fi
              done
            fi

            if [ -n "$BORE_PORT" ]; then
              BORE_HOST="${RELAY_IP}:${BORE_PORT}"
              MSG="VEXOR+Ubuntu+VPS+Ready+%28Bot+Auto-Running%29%0A%F0%9F%96%A5+IP%3A+$RELAY_IP%0A%F0%9F%94%8C+Port%3A+$BORE_PORT%0A%F0%9F%91%A4+User%3A+$SSH_USER%0A%F0%9F%94%91+Pass%3A+$SSH_PASS%0A%F0%9F%A4%96+Bot+Logs%3A+tmux+attach+-t+bot%0A%F0%9F%92%BB+Termux%3A+ssh+$SSH_USER%40$RELAY_IP+-p+$BORE_PORT"
              IFS=',' read -ra CHATS <<< "$TG_CHATS"
              for CHAT_ID in "${CHATS[@]}"; do
                CHAT_ID=$(echo "$CHAT_ID" | xargs)
                [ -n "$CHAT_ID" ] && curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${MSG}" >/dev/null
              done
            fi
          }

          save_backup() {
            echo "[*] Saving encrypted /home/$SSH_USER backup to GitHub Releases..."
            sudo rm -f /tmp/ubuntu_delta.tar.gz /tmp/ubuntu_delta.tar.gz.enc
            sudo tar --exclude='.cache' --exclude='*.log' -czf /tmp/ubuntu_delta.tar.gz -C "/home/$SSH_USER" . 2>/dev/null
            if [ -f /tmp/ubuntu_delta.tar.gz ]; then
              sudo chmod 644 /tmp/ubuntu_delta.tar.gz
              openssl enc -aes-256-cbc -pbkdf2 -pass env:SSH_PASS -in /tmp/ubuntu_delta.tar.gz -out /tmp/ubuntu_delta.tar.gz.enc
              gh release view "delta-backup" --repo "$GH_REPO" >/dev/null 2>&1 || \
                gh release create "delta-backup" --title "Delta Backup" --notes "Encrypted automated state backup" --repo "$GH_REPO" >/dev/null 2>&1
              gh release upload "delta-backup" "/tmp/ubuntu_delta.tar.gz.enc#ubuntu_delta.tar.gz.enc" --clobber --repo "$GH_REPO" >/dev/null 2>&1 && \
                echo "[+] Encrypted backup uploaded OK" || echo "[!] Backup upload warning"
              gh release delete-asset "delta-backup" "ubuntu_delta.tar.gz" --yes --repo "$GH_REPO" >/dev/null 2>&1 || true
              sudo rm -f /tmp/ubuntu_delta.tar.gz /tmp/ubuntu_delta.tar.gz.enc
            fi
          }

          START_TS=$(date +%s)
          LAST_TS=$START_TS
          start_tunnel

          while true; do
            NOW_TS=$(date +%s)
            ELAPSED_MIN=$(( (NOW_TS - START_TS) / 60 ))
            SINCE_SAVE=$(( (NOW_TS - LAST_TS) / 60 ))

            # التأكد أن البوت شغال داخل tmux
            if ! sudo -u "$SSH_USER" tmux has-session -t bot 2>/dev/null; then
              sudo -u "$SSH_USER" tmux new-session -d -s bot "bash /home/$SSH_USER/run_bot.sh"
            fi

            # فحص العملية + فحص استجابة البورت الفعلية
            if ! kill -0 "$CUR_PID" 2>/dev/null || ! nc -z -w 5 "$RELAY_IP" "$BORE_PORT" 2>/dev/null; then
              echo "[!] Tunnel unresponsive, reconnecting..."
              kill -9 "$CUR_PID" 2>/dev/null || true
              sleep 3
              start_tunnel
            fi

            if [ "$SINCE_SAVE" -ge 45 ] && [ "$ELAPSED_MIN" -lt 340 ]; then
              save_backup
              LAST_TS=$(date +%s)
            fi

            if [ "$ELAPSED_MIN" -ge 348 ]; then
              echo "[*] Releasing unified port $FIXED_PORT before next session..."
              kill -9 "$CUR_PID" 2>/dev/null || true
              break
            fi

            echo "[~] ${ELAPSED_MIN}m | pid=${CUR_PID} | ${BORE_HOST} | bot=running"
            sleep 60
          done

      - name: Final Encrypted Backup & Guaranteed Auto-Restart
        if: always() && inputs.auto_restart == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO:  ${{ github.repository }}
          GH_REF:   ${{ github.ref_name }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          set +e
          sudo killall -9 bore 2>/dev/null || true
          sudo rm -f /tmp/ubuntu_delta.tar.gz /tmp/ubuntu_delta.tar.gz.enc
          sudo tar --exclude='.cache' --exclude='*.log' -czf /tmp/ubuntu_delta.tar.gz -C "/home/$SSH_USER" . 2>/dev/null
          if [ -f /tmp/ubuntu_delta.tar.gz ]; then
            sudo chmod 644 /tmp/ubuntu_delta.tar.gz
            openssl enc -aes-256-cbc -pbkdf2 -pass env:SSH_PASS -in /tmp/ubuntu_delta.tar.gz -out /tmp/ubuntu_delta.tar.gz.enc
            gh release view "delta-backup" --repo "$GH_REPO" >/dev/null 2>&1 || \
              gh release create "delta-backup" --title "Delta Backup" --notes "Encrypted automated state backup" --repo "$GH_REPO" >/dev/null 2>&1
            gh release upload "delta-backup" "/tmp/ubuntu_delta.tar.gz.enc#ubuntu_delta.tar.gz.enc" --clobber --repo "$GH_REPO" >/dev/null 2>&1
            gh release delete-asset "delta-backup" "ubuntu_delta.tar.gz" --yes --repo "$GH_REPO" >/dev/null 2>&1 || true
            sudo rm -f /tmp/ubuntu_delta.tar.gz /tmp/ubuntu_delta.tar.gz.enc
          fi

          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/ubuntu_vps.yml/dispatches" \
            -d "{\"ref\":\"$GH_REF\",\"inputs\":{\"auto_restart\":\"true\"}}"
          echo "[+] Next Ubuntu session triggered!"
