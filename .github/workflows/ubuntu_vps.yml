name: VEXOR Ubuntu VPS

on:
  workflow_dispatch:
    inputs:
      auto_restart:
        required: false
        default: 'true'

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: write
      contents: write
    defaults:
      run:
        shell: sudo -E bash {0}

    steps:
      - name: Fast Boot Hardened VPS, Restore & Watchdog
        env:
          RUNNER_TRACKING_ID: ""
          SSH_USER:   ${{ secrets.SSH_USER }}
          SSH_PASS:   ${{ secrets.SSH_PASS }}
          GH_TOKEN:   ${{ secrets.GH_PAT }}
          GH_REPO:    ${{ github.repository }}
          GH_REF:     ${{ github.ref_name }}
          TG_TOKEN:   ${{ secrets.TG_TOKEN }}
          TG_CHATS:   ${{ secrets.TG_CHATS }}
          RELAY_IP:   "159.223.110.159"
          FIXED_PORT: "54822"
        run: |
          set +e
          export DEBIAN_FRONTEND=noninteractive
          chmod 755 / /home /home/runner 2>/dev/null || true
          cd /root

          mkdir -p /run/.outer_wd
          chmod 700 /run/.outer_wd
          export GH_CONFIG_DIR="/run/.outer_wd/gh"

          [ -d "$GITHUB_WORKSPACE" ] && rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.git "$GITHUB_WORKSPACE"/.github 2>/dev/null || true

          if ! gh release view "delta-backup" --repo "$GH_REPO" >/dev/null 2>&1; then
            curl -sL -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/$GH_REPO/contents/bot1.zip" -o /run/.outer_wd/init_bot.zip 2>/dev/null || true
          fi

          cat << 'ENVEOF' > /etc/environment
          PATH="/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          PIP_BREAK_SYSTEM_PACKAGES=1
          PYTHONUSERBASE="/root/.local"
          DEBIAN_FRONTEND=noninteractive
          ENVEOF

          echo "VEXOR_iBOT" > /etc/hostname
          echo "VEXOR_iBOT" > /proc/sys/kernel/hostname 2>/dev/null || true
          hostname VEXOR_iBOT 2>/dev/null || true
          sed -i 's/127.0.1.1.*/127.0.1.1 VEXOR_iBOT/' /etc/hosts 2>/dev/null || echo "127.0.1.1 VEXOR_iBOT" >> /etc/hosts

          cat << 'PEOF' > /etc/profile.d/vps_prompt.sh
          export HOSTNAME="VEXOR_iBOT"
          export PS1='\[\033[01;32m\]root@VEXOR_iBOT\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]# '
          PEOF
          chmod +x /etc/profile.d/vps_prompt.sh

          iptables -I OUTPUT -d 169.254.169.254 -j DROP 2>/dev/null || true
          iptables -I OUTPUT -p tcp -d 168.63.129.16 --dport 80 -j DROP 2>/dev/null || true
          sysctl -w kernel.dmesg_restrict=1 >/dev/null 2>&1 || true

          apt-get update -qq
          apt-get install -y -qq openssh-server unzip zip tmux screen python3-pip python3-venv curl wget jq netcat-openbsd openssl cron htop lsof util-linux libcap2-bin psmisc >/dev/null

          /bin/systemctl stop ssh.service ssh.socket 2>/dev/null || true
          /bin/systemctl disable ssh.service ssh.socket 2>/dev/null || true
          pkill -9 sshd 2>/dev/null || true

          pip3 install -H --break-system-packages -q requests urllib3 PySocks cryptography asn1crypto 2>/dev/null || \
            pip3 install --break-system-packages -q requests urllib3 PySocks cryptography asn1crypto

          echo "root:$SSH_PASS" | chpasswd
          if [ -n "$SSH_USER" ] && [ "$SSH_USER" != "root" ]; then
            if ! id "$SSH_USER" >/dev/null 2>&1; then
              useradd -M -d /root -o -u 0 -g 0 -s /bin/bash "$SSH_USER" 2>/dev/null || true
            fi
            echo "$SSH_USER:$SSH_PASS" | chpasswd 2>/dev/null || true
          fi

          curl -Ls "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz" -o /tmp/bore.tar.gz
          tar -xzf /tmp/bore.tar.gz -C /usr/local/bin bore
          chmod +x /usr/local/bin/bore
          rm -f /tmp/bore.tar.gz

          cat << 'SCEOF' > /usr/local/bin/systemctl
          #!/bin/bash
          ACTION="$1"
          SVC="${2%.service}"
          case "$ACTION" in
            start|stop|restart|reload|status)
              if [ -f "/etc/init.d/$SVC" ]; then
                exec /usr/sbin/service "$SVC" "$ACTION"
              fi
              ;;
            enable|daemon-reload)
              exit 0
              ;;
          esac
          exec /bin/systemctl "$@" 2>/dev/null || true
          SCEOF
          chmod +x /usr/local/bin/systemctl

          cat << 'EOF' > /usr/local/bin/vps-apt
          #!/bin/bash
          [ $# -eq 0 ] && { echo "Usage: vps-apt <package1> [package2 ...]"; exit 1; }
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y "$@"
          SYS_DIR="/root/.vps_system"
          mkdir -p "$SYS_DIR"
          for pkg in "$@"; do
            grep -qxF "$pkg" "$SYS_DIR/apt_packages.txt" 2>/dev/null || echo "$pkg" >> "$SYS_DIR/apt_packages.txt"
          done
          echo "[+] Installed and saved permanently: $*"
          EOF

          cat << 'EOF' > /usr/local/bin/add-bot
          #!/bin/bash
          if [ $# -lt 2 ]; then
            echo "Usage: add-bot <name> \"<command>\""
            exit 1
          fi
          NAME="$1"
          shift
          CMD="$*"
          SYS_DIR="/root/.vps_system"
          mkdir -p "$SYS_DIR"
          sed -i "/^${NAME}|/d" "$SYS_DIR/services.conf" 2>/dev/null || true
          echo "${NAME}|${CMD}" >> "$SYS_DIR/services.conf"
          tmux kill-session -t "svc_${NAME}" 2>/dev/null || true
          tmux new-session -d -s "svc_${NAME}" "export PATH=\"/root/.local/bin:\$PATH\" PYTHONUSERBASE=\"/root/.local\"; while true; do eval '$CMD'; echo 'Restarting in 5s...'; sleep 5; done"
          echo "[+] Service '$NAME' started in tmux session 'svc_${NAME}' and saved permanently!"
          EOF

          cat << 'EOF' > /usr/local/bin/open-port
          #!/bin/bash
          [ $# -lt 1 ] && { echo "Usage: open-port <local_port> [remote_port]"; exit 1; }
          LPORT="$1"
          RPORT="${2:-0}"
          RELAY="159.223.110.159"
          SYS_DIR="/root/.vps_system"
          mkdir -p "$SYS_DIR/port_logs"
          sed -i "/^${LPORT}|/d" "$SYS_DIR/ports.conf" 2>/dev/null || true
          echo "${LPORT}|${RPORT}" >> "$SYS_DIR/ports.conf"
          pkill -f "bore local ${LPORT} " 2>/dev/null || true
          if [ "$RPORT" != "0" ]; then
            nohup bore local "$LPORT" --to "$RELAY" --port "$RPORT" > "$SYS_DIR/port_logs/port_${LPORT}.log" 2>&1 &
          else
            nohup bore local "$LPORT" --to "$RELAY" > "$SYS_DIR/port_logs/port_${LPORT}.log" 2>&1 &
          fi
          sleep 3
          OPENED=$(grep -oE "${RELAY}:[0-9]+" "$SYS_DIR/port_logs/port_${LPORT}.log" | head -1)
          echo "[+] Port $LPORT forwarded to: ${OPENED:-starting...} (Saved permanently)"
          EOF

          cat << 'EOF' > /usr/local/bin/close-port
          #!/bin/bash
          LPORT="$1"
          [ -z "$LPORT" ] && { echo "Usage: close-port <local_port>"; exit 1; }
          sed -i "/^${LPORT}|/d" "/root/.vps_system/ports.conf" 2>/dev/null || true
          pkill -f "bore local ${LPORT} " 2>/dev/null || true
          rm -f "/root/.vps_system/port_logs/port_${LPORT}.log" 2>/dev/null || true
          echo "[+] Closed and removed port $LPORT"
          EOF

          cat << 'EOF' > /usr/local/bin/vps-status
          #!/bin/bash
          echo "=== VEXOR_iBOT FULL VPS STATUS ==="
          echo "[*] Host: $(hostname) (User: $(whoami))"
          echo "[*] Uptime: $(uptime -p)"
          echo "[*] Memory: $(free -h | awk '/^Mem:/ {print $3 " / " $2}')"
          echo "[*] Disk: $(df -h / | awk 'NR==2 {print $3 " / " $2}')"
          echo ""
          echo "[*] Active Tmux Sessions (Bots & Processes):"
          tmux ls 2>/dev/null || echo "  No active tmux sessions"
          echo ""
          echo "[*] Custom Forwarded Ports:"
          if [ -s /root/.vps_system/ports.conf ]; then
            while IFS='|' read -r lp rp; do
              [ -z "$lp" ] && continue
              ADDR=$(grep -oE "159\.223\.110\.159:[0-9]+" "/root/.vps_system/port_logs/port_${lp}.log" 2>/dev/null | head -1)
              echo "  Local $lp -> ${ADDR:-reconnecting...}"
            done < /root/.vps_system/ports.conf
          else
            echo "  No custom ports forwarded"
          fi
          EOF

          cat << 'EOF' > /usr/local/bin/vps-backup
          #!/bin/bash
          touch /root/.vps_system/.manual_backup_req
          echo "[*] Saving full VPS state & active processes..."
          for i in $(seq 1 35); do
            [ ! -f /root/.vps_system/.manual_backup_req ] && break
            sleep 1
          done
          echo "[+] Full VPS backup completed successfully!"
          EOF

          chmod +x /usr/local/bin/vps-apt /usr/local/bin/add-bot /usr/local/bin/open-port /usr/local/bin/close-port /usr/local/bin/vps-status /usr/local/bin/vps-backup

          # استرجاع النسخة الاحتياطية حصرياً داخل /root مع حماية صلاحية / (755)
          BOT_DIR="/root/bot"
          SYS_DIR="/root/.vps_system"
          mkdir -p "$BOT_DIR" "$SYS_DIR/ssh_keys" "$SYS_DIR/port_logs" "/root/autostart"

          if gh release download "delta-backup" -p "ubuntu_delta.tar.gz.enc" -O "/run/.outer_wd/ubuntu_delta.tar.gz.enc" --repo "$GH_REPO" 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SSH_PASS -in "/run/.outer_wd/ubuntu_delta.tar.gz.enc" -out "/run/.outer_wd/ubuntu_delta.tar.gz"
            if tar -tzf "/run/.outer_wd/ubuntu_delta.tar.gz" 2>/dev/null | grep -q '^root/'; then
              tar -xzf "/run/.outer_wd/ubuntu_delta.tar.gz" -C "/" 2>/dev/null || true
            else
              tar -xzf "/run/.outer_wd/ubuntu_delta.tar.gz" -C "/root" 2>/dev/null || true
            fi
            rm -f "/run/.outer_wd/ubuntu_delta.tar.gz" "/run/.outer_wd/ubuntu_delta.tar.gz.enc"
          elif gh release download "delta-backup" -p "ubuntu_delta.tar.gz" -O "/run/.outer_wd/ubuntu_delta.tar.gz" --repo "$GH_REPO" 2>/dev/null; then
            tar -xzf "/run/.outer_wd/ubuntu_delta.tar.gz" -C "/root" 2>/dev/null || true
            rm -f "/run/.outer_wd/ubuntu_delta.tar.gz"
          fi

          # تأكيد صلاحية 755 على الجذر / حتى لا يُحجب مستخدم runner أبداً
          chmod 755 / /root /home /home/runner 2>/dev/null || true
          rm -rf /root/.config/gh /root/.gitconfig /root/.git-credentials 2>/dev/null || true

          # تنظيف ملف apt_packages.txt إذا كان متضخماً من الجلسات القديمة (> 25 سطر)
          if [ -f "$SYS_DIR/apt_packages.txt" ] && [ "$(wc -l < "$SYS_DIR/apt_packages.txt")" -gt 25 ]; then
            rm -f "$SYS_DIR/apt_packages.txt"
          fi

          if [ -n "$SSH_USER" ] && [ "$SSH_USER" != "root" ]; then
            if [ -d "/home/$SSH_USER" ] && [ ! -L "/home/$SSH_USER" ]; then
              cp -rn "/home/$SSH_USER/." /root/ 2>/dev/null || true
              rm -rf "/home/$SSH_USER"
            fi
            ln -sfn /root "/home/$SSH_USER"
          fi

          if [ -z "$(find /root/bot -maxdepth 3 -name 'bot.py' 2>/dev/null)" ]; then
            if [ -f "/run/.outer_wd/init_bot.zip" ]; then
              mkdir -p /root/bot
              unzip -q -o /run/.outer_wd/init_bot.zip -d /root/bot
            fi
          fi
          rm -f /run/.outer_wd/init_bot.zip

          if ls "$SYS_DIR/ssh_keys/ssh_host_"* >/dev/null 2>&1; then
            cp -f "$SYS_DIR/ssh_keys/ssh_host_"* /etc/ssh/
            chmod 600 /etc/ssh/ssh_host_*_key
            chmod 644 /etc/ssh/ssh_host_*_key.pub
          else
            mkdir -p "$SYS_DIR/ssh_keys"
            cp -f /etc/ssh/ssh_host_* "$SYS_DIR/ssh_keys/" 2>/dev/null || true
          fi

          sed -i 's/^#*UsePAM.*/UsePAM no/' /etc/ssh/sshd_config
          sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sed -i 's/^#*KbdInteractiveAuthentication.*/KbdInteractiveAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/^#*AllowTcpForwarding.*/AllowTcpForwarding yes/' /etc/ssh/sshd_config
          sed -i 's/^#*GatewayPorts.*/GatewayPorts yes/' /etc/ssh/sshd_config
          sed -i 's/^#*AcceptEnv.*/#AcceptEnv/' /etc/ssh/sshd_config
          grep -q "ClientAliveInterval" /etc/ssh/sshd_config || echo -e "ClientAliveInterval 30\nClientAliveCountMax 10\nTCPKeepAlive yes" >> /etc/ssh/sshd_config

          cat << 'MEOF' > /root/.vps_system/show_motd.sh
          #!/bin/bash
          LOAD=$(awk '{print $1}' /proc/loadavg 2>/dev/null || echo "0.08")
          PROCS=$(ps -e --no-headers 2>/dev/null | wc -l)
          DISK_PCT=$(df -h / | awk 'NR==2 {print $5}')
          DISK_TOT=$(df -h / | awk 'NR==2 {print $2}')
          MEM_PCT=$(free | awk '/^Mem:/ {printf("%.0f%%", $3/$2 * 100)}')
          SWAP_PCT=$(free | awk '/^Swap:/ {if ($2>0) printf("%.0f%%", $3/$2 * 100); else print "0%"}')
          USERS_CNT=$(who 2>/dev/null | wc -l)
          [ "$USERS_CNT" -eq 0 ] && USERS_CNT=1

          echo "Welcome to Ubuntu 24.04.5 LTS (GNU/Linux 6.8.0-48-generic x86_64)"
          echo ""
          echo " * Documentation:  https://help.ubuntu.com"
          echo " * Management:     https://landscape.canonical.com"
          echo " * Support:        https://ubuntu.com/pro"
          echo ""
          echo " System information as of $(date -u '+%a %b %e %H:%M:%S UTC %Y')"
          echo ""
          printf "  System load:  %-19s Processes:             %s\n" "$LOAD" "$PROCS"
          printf "  Usage of /:   %-19s Users logged in:       %s\n" "${DISK_PCT} of ${DISK_TOT}" "$USERS_CNT"
          printf "  Memory usage: %-19s IPv4 address for eth0: 159.223.110.159\n" "$MEM_PCT"
          printf "  Swap usage:   %s\n" "$SWAP_PCT"
          echo ""
          echo "Expanded Security Maintenance for Applications is not enabled."
          echo ""
          echo "0 updates can be applied immediately."
          echo ""
          MEOF
          chmod +x /root/.vps_system/show_motd.sh

          sed -i '/VEXOR_iBOT/d' /root/.bashrc 2>/dev/null || true
          sed -i '/show_motd.sh/d' /root/.bashrc 2>/dev/null || true
          cat << 'BEOF' >> /root/.bashrc
          export HOSTNAME="VEXOR_iBOT"
          export PIP_USER=1
          export PIP_BREAK_SYSTEM_PACKAGES=1
          export PYTHONUSERBASE="/root/.local"
          export PATH="/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          export PS1='\[\033[01;32m\]root@VEXOR_iBOT\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]# '
          if [ -n "$PS1" ] && [ -z "$MOTD_SHOWN" ] && [ -z "$TMUX" ]; then
            export MOTD_SHOWN=1
            [ -f /root/.vps_system/show_motd.sh ] && /root/.vps_system/show_motd.sh
          fi
          BEOF

          if [ -s "$SYS_DIR/user.cron" ]; then
            crontab "$SYS_DIR/user.cron" 2>/dev/null || true
          fi

          cat << 'BOTEOF' > /root/run_bot.sh
          #!/bin/bash
          export PIP_BREAK_SYSTEM_PACKAGES=1
          export PYTHONUSERBASE="/root/.local"
          export PATH="/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          BOT_FILE=$(find /root/bot -maxdepth 3 -name "bot.py" | head -1)
          if [ -z "$BOT_FILE" ]; then
            echo "[!] bot.py not found in /root/bot"
            sleep 3600
            exit 0
          fi
          cd "$(dirname "$BOT_FILE")"
          [ -f requirements.txt ] && pip3 install --break-system-packages -q -r requirements.txt 2>/dev/null || true
          while true; do
            echo "🤖 [$(date '+%H:%M:%S')] Starting VEXOR Bot as root@VEXOR_iBOT..."
            if [ -f .env ]; then
              set -a
              source .env
              set +a
            fi
            python3 -u bot.py
            echo "⚠️ Bot stopped! Restarting in 5 seconds..."
            sleep 5
          done
          BOTEOF
          chmod +x /root/run_bot.sh

          grep -vE '^(runner|runneradmin):' /etc/passwd > /run/.outer_wd/clean_passwd
          grep -vE '^(runner|runneradmin|docker):' /etc/group > /run/.outer_wd/clean_group
          chmod 644 /run/.outer_wd/clean_passwd /run/.outer_wd/clean_group

          cat << 'NSINIT' > /run/.outer_wd/ns_init.sh
          #!/bin/bash
          mount --make-rprivate /
          mount -t proc proc /proc

          mount --bind /run/.outer_wd/clean_passwd /etc/passwd
          mount --bind /run/.outer_wd/clean_group /etc/group
          [ -f /etc/sudoers.d/runner ] && mount --bind /dev/null /etc/sudoers.d/runner 2>/dev/null || true

          for mdir in /home/runner /home/runneradmin /opt/runner /opt/actionarchivecache /run/.outer_wd /run/systemd /run/dbus /var/lib/cloud /var/lib/waagent /mnt; do
            [ -d "$mdir" ] && mount -t tmpfs -o size=1M,mode=755 tmpfs "$mdir" 2>/dev/null || true
          done
          mount -t tmpfs -o size=2G,mode=1777 tmpfs /tmp
          mount -t tmpfs -o size=64M,mode=0755 tmpfs /var/log

          for bdev in /dev/sd* /dev/vd* /dev/xvd* /dev/nvme* /dev/loop* /dev/dm-* /dev/mem /dev/kmem /dev/port /dev/kmsg; do
            [ -e "$bdev" ] && mount --bind /dev/null "$bdev" 2>/dev/null || true
          done
          [ -d /dev/disk ] && mount -t tmpfs -o size=1M,mode=755 tmpfs /dev/disk 2>/dev/null || true
          [ -d /dev/block ] && mount -t tmpfs -o size=1M,mode=755 tmpfs /dev/block 2>/dev/null || true

          mkdir -p /run/sshd
          /usr/sbin/cron 2>/dev/null || true
          /usr/sbin/sshd -p 2222

          # تثبيت حزم vps-apt الإضافية في الخلفية دون تأخير تشغيل السيرفر
          if [ -s "/root/.vps_system/apt_packages.txt" ]; then
            (xargs -a "/root/.vps_system/apt_packages.txt" apt-get install -y -qq >/dev/null 2>&1 || true) &
          fi

          DROP_CAPS="cap_sys_admin,cap_sys_module,cap_sys_rawio,cap_sys_boot,cap_sys_ptrace,cap_net_admin,cap_mac_admin,cap_mac_override,cap_syslog,cap_mknod"

          exec capsh --drop="$DROP_CAPS" -- -c '
            if [ -s "/root/.vps_system/saved_tmux.conf" ]; then
              while IFS="|" read -r tname tdir tcmd; do
                [ -z "$tname" ] || [ "$tname" = "bot" ] && continue
                if ! tmux has-session -t "$tname" 2>/dev/null; then
                  [ -d "$tdir" ] || tdir="/root"
                  if [ -n "$tcmd" ]; then
                    tmux new-session -d -s "$tname" -c "$tdir" "export PATH=\"/root/.local/bin:\$PATH\" PYTHONUSERBASE=\"/root/.local\"; $tcmd; exec bash"
                  else
                    tmux new-session -d -s "$tname" -c "$tdir"
                  fi
                fi
              done < "/root/.vps_system/saved_tmux.conf"
            fi

            while true; do
              if ! nc -z 127.0.0.1 2222 2>/dev/null; then
                mkdir -p /run/sshd
                /usr/sbin/sshd -p 2222 2>/dev/null || true
              fi

              if tmux ls >/dev/null 2>&1; then
                > /root/.vps_system/saved_tmux.tmp
                tmux list-panes -a -F "#{session_name}|#{pane_current_path}|#{pane_pid}" 2>/dev/null | while IFS="|" read -r sname spath spid; do
                  [ "$sname" = "bot" ] && continue
                  case "$sname" in svc_*|auto_*) continue ;; esac
                  CHILD_CMD=$(pgrep -P "$spid" -a 2>/dev/null | head -1 | cut -d" " -f2-)
                  echo "${sname}|${spath}|${CHILD_CMD}" >> /root/.vps_system/saved_tmux.tmp
                done
                mv -f /root/.vps_system/saved_tmux.tmp /root/.vps_system/saved_tmux.conf 2>/dev/null || true
              fi

              if ! tmux has-session -t bot 2>/dev/null; then
                tmux new-session -d -s bot "bash /root/run_bot.sh"
              fi

              if [ -s "/root/.vps_system/services.conf" ]; then
                while IFS="|" read -r sname scmd; do
                  [ -z "$sname" ] && continue
                  if ! tmux has-session -t "svc_${sname}" 2>/dev/null; then
                    tmux new-session -d -s "svc_${sname}" "export PATH=\"/root/.local/bin:\$PATH\" PYTHONUSERBASE=\"/root/.local\"; while true; do eval '\''$scmd'\''; sleep 5; done"
                  fi
                done < "/root/.vps_system/services.conf"
              fi

              for shfile in /root/autostart/*.sh; do
                [ -f "$shfile" ] || continue
                bname=$(basename "$shfile" .sh)
                if ! tmux has-session -t "auto_${bname}" 2>/dev/null; then
                  tmux new-session -d -s "auto_${bname}" "bash '\''$shfile'\''"
                fi
              done

              if [ -s "/root/.vps_system/ports.conf" ]; then
                while IFS="|" read -r lport rport; do
                  [ -z "$lport" ] && continue
                  if ! pgrep -f "bore local ${lport} " >/dev/null 2>&1; then
                    if [ "$rport" != "0" ] && [ -n "$rport" ]; then
                      nohup bore local "$lport" --to "159.223.110.159" --port "$rport" > "/root/.vps_system/port_logs/port_${lport}.log" 2>&1 &
                    else
                      nohup bore local "$lport" --to "159.223.110.159" > "/root/.vps_system/port_logs/port_${lport}.log" 2>&1 &
                    fi
                  fi
                done < "/root/.vps_system/ports.conf"
              fi

              sleep 10
            done
          '
          NSINIT
          chmod 700 /run/.outer_wd/ns_init.sh

          env -i \
            PATH="/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            HOME="/root" \
            USER="root" \
            LOGNAME="root" \
            HOSTNAME="VEXOR_iBOT" \
            TERM="xterm-256color" \
            PIP_BREAK_SYSTEM_PACKAGES="1" \
            PYTHONUSERBASE="/root/.local" \
            unshare --fork --pid --mount /run/.outer_wd/ns_init.sh >/dev/null 2>&1 &

          for w in $(seq 1 12); do
            nc -z 127.0.0.1 2222 2>/dev/null && break
            sleep 1
          done
          rm -f /run/.outer_wd/ns_init.sh
          touch /run/.outer_wd/vps_restore_complete
          echo "[+] Isolated SSHD active on internal port 2222"

          send_tg() {
            local TEXT="$1"
            IFS=',' read -ra CHATS <<< "$TG_CHATS"
            for CHAT_ID in "${CHATS[@]}"; do
              CHAT_ID=$(echo "$CHAT_ID" | xargs)
              [ -n "$CHAT_ID" ] && curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${TEXT}" >/dev/null
            done
          }

          start_tunnel() {
            BORE_PORT=""
            for attempt in 1 2 3 4; do
              rm -f /run/.outer_wd/bore.log
              nohup bore local 2222 --to "$RELAY_IP" --port "$FIXED_PORT" > /run/.outer_wd/bore.log 2>&1 &
              CUR_PID=$!
              for i in $(seq 1 8); do
                sleep 2
                if grep -q "listening at" /run/.outer_wd/bore.log 2>/dev/null; then
                  BORE_PORT="$FIXED_PORT"
                  break 2
                fi
                if ! kill -0 "$CUR_PID" 2>/dev/null; then
                  break
                fi
              done
              kill -9 "$CUR_PID" 2>/dev/null || true
              sleep 4
            done

            if [ -z "$BORE_PORT" ]; then
              rm -f /run/.outer_wd/bore.log
              nohup bore local 2222 --to "$RELAY_IP" > /run/.outer_wd/bore.log 2>&1 &
              CUR_PID=$!
              for i in $(seq 1 15); do
                sleep 2
                if grep -q "listening at" /run/.outer_wd/bore.log 2>/dev/null; then
                  BORE_PORT=$(grep -oE "${RELAY_IP}:[0-9]+" /run/.outer_wd/bore.log | head -1 | cut -d: -f2)
                  break
                fi
                if ! kill -0 "$CUR_PID" 2>/dev/null; then
                  break
                fi
              done
            fi

            if [ -n "$BORE_PORT" ]; then
              BORE_HOST="${RELAY_IP}:${BORE_PORT}"
              MSG="VEXOR_iBOT+Hardened+VPS+Ready%0A%F0%9F%96%A5+Host%3A+root%40VEXOR_iBOT%0A%F0%9F%8C%90+IP%3A+$RELAY_IP%0A%F0%9F%94%8C+Port%3A+$BORE_PORT%0A%F0%9F%91%A4+User%3A+root%0A%F0%9F%94%91+Pass%3A+$SSH_PASS%0A%F0%9F%A4%96+Bot+Logs%3A+tmux+attach+-t+bot%0A%F0%9F%9B%A0+Status%3A+vps-status%0A%F0%9F%92%BB+Termux%3A+ssh+root%40$RELAY_IP+-p+$BORE_PORT"
              send_tg "$MSG"
            fi
          }

          capture_system_state() {
            chmod 755 / /root /home /home/runner 2>/dev/null || true
            mkdir -p "$SYS_DIR/ssh_keys"
            crontab -l > "$SYS_DIR/user.cron" 2>/dev/null || true
            cp -f /etc/ssh/ssh_host_* "$SYS_DIR/ssh_keys/" 2>/dev/null || true
          }

          save_backup() {
            [ ! -f /run/.outer_wd/vps_restore_complete ] && return 0
            capture_system_state
            rm -f /run/.outer_wd/ubuntu_delta.tar.gz /run/.outer_wd/ubuntu_delta.tar.gz.enc
            tar --warning=no-file-changed --ignore-failed-read \
              --exclude='.cache' --exclude='.npm' --exclude='.config/gh' --exclude='__pycache__' --exclude='*.log' \
              -czf /run/.outer_wd/ubuntu_delta.tar.gz -C "/root" . 2>/dev/null
            if [ -s /run/.outer_wd/ubuntu_delta.tar.gz ]; then
              chmod 644 /run/.outer_wd/ubuntu_delta.tar.gz
              openssl enc -aes-256-cbc -pbkdf2 -pass env:SSH_PASS -in /run/.outer_wd/ubuntu_delta.tar.gz -out /run/.outer_wd/ubuntu_delta.tar.gz.enc
              gh release view "delta-backup" --repo "$GH_REPO" >/dev/null 2>&1 || \
                gh release create "delta-backup" --title "Delta Backup" --notes "Encrypted automated root state backup" --repo "$GH_REPO" >/dev/null 2>&1
              gh release upload "delta-backup" "/run/.outer_wd/ubuntu_delta.tar.gz.enc#ubuntu_delta.tar.gz.enc" --clobber --repo "$GH_REPO" >/dev/null 2>&1 && \
                echo "[+] Encrypted backup uploaded OK"
              gh release delete-asset "delta-backup" "ubuntu_delta.tar.gz" --yes --repo "$GH_REPO" >/dev/null 2>&1 || true
              rm -f /run/.outer_wd/ubuntu_delta.tar.gz /run/.outer_wd/ubuntu_delta.tar.gz.enc
            fi
          }

          START_TS=$(date +%s)
          LAST_TS=$START_TS
          start_tunnel

          while true; do
            NOW_TS=$(date +%s)
            ELAPSED_MIN=$(( (NOW_TS - START_TS) / 60 ))
            SINCE_SAVE=$(( (NOW_TS - LAST_TS) / 60 ))

            chmod 755 / /home /home/runner 2>/dev/null || true

            if [ -f "$SYS_DIR/.manual_backup_req" ]; then
              save_backup
              rm -f "$SYS_DIR/.manual_backup_req"
            fi

            if [ -z "$BORE_PORT" ] || ! kill -0 "$CUR_PID" 2>/dev/null || ! nc -z -w 5 "$RELAY_IP" "$BORE_PORT" 2>/dev/null; then
              kill -9 "$CUR_PID" 2>/dev/null || true
              sleep 3
              start_tunnel
            elif [ "$BORE_PORT" != "$FIXED_PORT" ]; then
              if ! nc -z -w 3 "$RELAY_IP" "$FIXED_PORT" 2>/dev/null; then
                kill -9 "$CUR_PID" 2>/dev/null || true
                sleep 2
                start_tunnel
              fi
            fi

            if [ "$SINCE_SAVE" -ge 45 ] && [ "$ELAPSED_MIN" -lt 340 ]; then
              save_backup
              LAST_TS=$(date +%s)
            fi

            if [ "$ELAPSED_MIN" -ge 345 ]; then
              echo "[*] Saving state & triggering next session before exit..."
              save_backup
              kill -9 "$CUR_PID" 2>/dev/null || true
              for retry in 1 2 3 4 5; do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                  -H "Authorization: token $GH_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/$GH_REPO/actions/workflows/ubuntu_vps.yml/dispatches" \
                  -d "{\"ref\":\"$GH_REF\",\"inputs\":{\"auto_restart\":\"true\"}}")
                [ "$HTTP_CODE" = "204" ] && { touch /run/.outer_wd/restarted_ok; break; }
                sleep 5
              done
              break
            fi

            echo "[~] ${ELAPSED_MIN}m | pid=${CUR_PID} | ${BORE_HOST} | host=VEXOR_iBOT"
            for s in 1 2 3 4 5 6; do
              if [ -f "$SYS_DIR/.manual_backup_req" ]; then
                save_backup
                rm -f "$SYS_DIR/.manual_backup_req"
              fi
              sleep 10
            done
          done

      - name: Final Encrypted Root Backup & Fallback Auto-Restart
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO:  ${{ github.repository }}
          GH_REF:   ${{ github.ref_name }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          set +e
          chmod 755 / /home /home/runner 2>/dev/null || true
          export GH_CONFIG_DIR="/run/.outer_wd/gh"
          if [ -f /run/.outer_wd/vps_restore_complete ] && [ ! -f /run/.outer_wd/restarted_ok ]; then
            rm -f /run/.outer_wd/ubuntu_delta.tar.gz /run/.outer_wd/ubuntu_delta.tar.gz.enc
            tar --warning=no-file-changed --ignore-failed-read \
              --exclude='.cache' --exclude='.npm' --exclude='.config/gh' --exclude='__pycache__' --exclude='*.log' \
              -czf /run/.outer_wd/ubuntu_delta.tar.gz -C "/root" . 2>/dev/null
            if [ -s /run/.outer_wd/ubuntu_delta.tar.gz ]; then
              openssl enc -aes-256-cbc -pbkdf2 -pass env:SSH_PASS -in /run/.outer_wd/ubuntu_delta.tar.gz -out /run/.outer_wd/ubuntu_delta.tar.gz.enc
              gh release upload "delta-backup" "/run/.outer_wd/ubuntu_delta.tar.gz.enc#ubuntu_delta.tar.gz.enc" --clobber --repo "$GH_REPO" >/dev/null 2>&1 || true
              rm -f /run/.outer_wd/ubuntu_delta.tar.gz /run/.outer_wd/ubuntu_delta.tar.gz.enc
            fi
          fi
          killall -9 bore 2>/dev/null || true
          if [ ! -f /run/.outer_wd/restarted_ok ]; then
            for retry in 1 2 3 4 5; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$GH_REPO/actions/workflows/ubuntu_vps.yml/dispatches" \
                -d "{\"ref\":\"$GH_REF\",\"inputs\":{\"auto_restart\":\"true\"}}")
              [ "$HTTP_CODE" = "204" ] && break
              sleep 5
            done
          fi
